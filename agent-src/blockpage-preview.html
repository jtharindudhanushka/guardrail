<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time's up for today</title>
<style>
  :root {
    --canvas: #f5f5f7;
    --card: #ffffff;
    --ink: #1d1d1f;
    --muted: #7a7a7a;
    --hairline: #e0e0e0;
    --accent: #0066cc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas: #1d1d1f;
      --card: #272729;
      --ink: #ffffff;
      --muted: #a1a1a6;
      --hairline: #3a3a3c;
      --accent: #2997ff;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--canvas);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.47;
    letter-spacing: -0.374px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--hairline);
    border-radius: 18px;
    padding: 48px 40px;
    max-width: 460px;
    width: 100%;
    text-align: center;
    animation: rise 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: none; }
  }
  .glyph {
    width: 56px; height: 56px;
    margin: 0 auto 24px;
    border-radius: 50%;
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    display: flex; align-items: center; justify-content: center;
  }
  .glyph svg { width: 26px; height: 26px; stroke: var(--accent); fill: none;
               stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  h1 {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.28px;
    line-height: 1.14;
    margin: 0 0 10px;
  }
  p.message { color: var(--muted); font-size: 17px; margin: 0; }
  p.detail {
    color: var(--muted); font-size: 14px; letter-spacing: -0.224px;
    margin: 20px 0 0; padding-top: 20px; border-top: 1px solid var(--hairline);
    word-break: break-all;
  }
  .reset {
    margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--hairline);
    display: flex; flex-direction: column; gap: 4px;
  }
  .reset-label { font-size: 12px; letter-spacing: -0.12px; color: var(--muted);
                 text-transform: uppercase; }
  .reset-time { font-size: 21px; font-weight: 600; letter-spacing: 0.231px;
                font-variant-numeric: tabular-nums; }
  @media (max-width: 480px) {
    .card { padding: 36px 24px; }
    h1 { font-size: 24px; }
  }
</style></head>
<body>
  <div class="card">
    <div class="glyph">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5l3 2"/></svg>
    </div>
    <h1>Time's up for today</h1>
    <p class="message">You've used your daily time for this site.</p>
    <p class="detail">instagram.com</p>
    
    <div class="reset">
      <span class="reset-label">Resets in</span>
      <span class="reset-time" id="countdown">—</span>
    </div>
    <script>
      (function () {
        var el = document.getElementById("countdown");
        function tick() {
          var now = new Date();
          var midnight = new Date(now);
          midnight.setHours(24, 0, 0, 0);
          var diff = midnight - now;
          var h = Math.floor(diff / 3600000);
          var m = Math.floor((diff % 3600000) / 60000);
          var s = Math.floor((diff % 60000) / 1000);
          el.textContent = h + "h " + String(m).padStart(2, "0") + "m " + String(s).padStart(2, "0") + "s";
        }
        tick();
        setInterval(tick, 1000);
      })();
    </script>
  </div>
</body></html>
